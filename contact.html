<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты — Клуб любителей кошек</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="container">
      <h1 class="site-title">🐱 Клуб любителей кошек</h1>
      <nav>
        <a href="index.html">Главная</a>
        <a href="about.html">О клубе</a>
        <a href="events.html">Мероприятия</a>
        <a href="gallery.html">Emoji-галерея</a>
        <a class="active-link" href="contact.html">Контакты</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <section class="card">
        <h2>Связаться с клубом</h2>
        <p>Заполните форму, и мы ответим вам по email.</p>

        <form id="contact-form">
          <label for="name">Ваше имя</label>
          <input type="text" id="name" placeholder="Например, Анна">

          <label for="email">Email</label>
          <input type="email" id="email" placeholder="example@mail.ru">

          <label for="message-text">Сообщение</label>
          <textarea id="message-text" placeholder="Хочу вступить в клуб..."></textarea>

          <button class="button" type="submit">Отправить</button>
        </form>

        <p id="form-message" class="message"></p>
      </section>
    </div>
  </main>

  <footer>
    <div class="container">
      <span>Пишите нам: meowclub@example.com</span>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
